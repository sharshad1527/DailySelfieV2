<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- DailySelfie App Gradient: Core Purple -> Vibrant Pink -> Amber -->
    <linearGradient id="dsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Lighter gradient for inner lens reflections -->
    <linearGradient id="dsGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
  </defs>

  <!-- App-style rounded container (Squircle) -->
  <rect x="36" y="36" width="440" height="440" rx="100" 
        fill="none" stroke="url(#dsGrad)" stroke-width="16" opacity="0.9"/>

  <!-- Daily Timer / Streak Progress Ring -->
  <!-- Background dashed track -->
  <circle cx="256" cy="256" r="150" 
          fill="none" stroke="#333333" stroke-width="10" 
          stroke-linecap="round" stroke-dasharray="1 24"/>
  <!-- Active progress sweep -->
  <circle cx="256" cy="256" r="150" 
          fill="none" stroke="url(#dsGrad)" stroke-width="16" 
          stroke-linecap="round" stroke-dasharray="650 942" 
          transform="rotate(-90 256 256)"/>

  <!-- AI Sparkles (MasterGPT Indicator) -->
  <path d="M 360 130 Q 375 130 375 115 Q 375 130 390 130 Q 375 130 375 145 Q 375 130 360 130" fill="url(#dsGrad)"/>
  <path d="M 130 350 Q 140 350 140 340 Q 140 350 150 350 Q 140 350 140 360 Q 140 350 130 350" fill="url(#dsGrad)"/>

  <!-- MasterGPT Camera Bot -->
  <g transform="translate(0, 10)">
      <!-- Shoulders -->
      <path d="M176 340 C 176 290, 206 270, 256 270 C 306 270, 336 290, 336 340 Z" fill="url(#dsGrad)"/>

      <!-- Head (Sleek Camera Pill) -->
      <rect x="186" y="150" width="140" height="100" rx="50" fill="url(#dsGrad)"/>

      <!-- Bot Eye (Primary Camera Lens) -->
      <circle cx="256" cy="200" r="32" fill="#121212"/>
      <!-- Inner Lens Ring -->
      <circle cx="256" cy="200" r="22" fill="none" stroke="url(#dsGradLight)" stroke-width="2" opacity="0.6"/>
      <!-- Lens Reflections -->
      <circle cx="266" cy="190" r="8" fill="#FFFFFF" opacity="0.9"/>
      <circle cx="248" cy="208" r="4" fill="#FFFFFF" opacity="0.7"/>
  </g>
</svg>